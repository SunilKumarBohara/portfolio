<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="32" fill="url(#heroGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Ambient Glow Behind Elements -->
  <circle cx="300" cy="260" r="160" fill="#3b82f6" opacity="0.18" filter="url(#glow)" />
  <circle cx="380" cy="340" r="120" fill="#ef4444" opacity="0.14" filter="url(#glow)" />

  <!-- Decorative Orbit Rings -->
  <circle cx="300" cy="270" r="190" fill="none" stroke="rgba(59,130,246,0.2)" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="300" cy="270" r="140" fill="none" stroke="rgba(239,68,68,0.25)" stroke-width="1.5" />

  <!-- Center Profile Graphic -->
  <circle cx="300" cy="270" r="100" fill="#0b1329" stroke="url(#ringGrad)" stroke-width="3" filter="url(#glow)" />

  <!-- Monogram Avatar Placeholder -->
  <circle cx="300" cy="245" r="45" fill="#1e293b" />
  <path d="M 220 350 C 220 295 380 295 380 350 Z" fill="#1e293b" />

  <!-- Badge Pill -->
  <g transform="translate(180, 430)">
    <rect width="240" height="42" rx="21" fill="rgba(15,23,42,0.85)" stroke="url(#ringGrad)" stroke-width="1.5" />
    <text x="120" y="26" text-anchor="middle" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
      UPLOAD YOUR PHOTO
    </text>
  </g>

  <!-- Tagline -->
  <text x="300" y="510" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">
    Appearance &gt; Customize &gt; Hero Image
  </text>
</svg>
